<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=300, initial-scale=1" />
    <title>小鹅通助手 Edge Logo Tile</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 300px;
        height: 300px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(52, 120, 246, 0.18) 0 38%, transparent 38%),
          linear-gradient(150deg, transparent 0 70%, rgba(24, 166, 106, 0.18) 70%),
          #f7fbff;
      }

      .tile {
        display: grid;
        width: 212px;
        height: 212px;
        place-items: center;
        border-radius: 50px;
        background: linear-gradient(145deg, #3478f6, #6658e8);
        box-shadow:
          0 28px 58px rgba(52, 120, 246, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }

      img {
        width: 156px;
        height: 156px;
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgba(23, 32, 51, 0.18));
      }
    </style>
  </head>
  <body>
    <main class="tile" aria-label="小鹅通助手">
      <img src="../../static/icons/icon-enabled-128.png" alt="" />
    </main>
  </body>
</html>
