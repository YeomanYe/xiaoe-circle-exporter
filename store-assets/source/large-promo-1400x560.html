<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1400, initial-scale=1" />
    <title>小鹅通助手 Marquee Promo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1400px;
        height: 560px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #172033;
        background: #f7fbff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", sans-serif;
      }

      .canvas {
        position: relative;
        width: 1400px;
        height: 560px;
        padding: 58px 68px;
        background:
          linear-gradient(112deg, rgba(52, 120, 246, 0.12) 0 42%, transparent 42%),
          linear-gradient(150deg, transparent 0 74%, rgba(24, 166, 106, 0.18) 74%),
          #f7fbff;
      }

      .stripe {
        position: absolute;
        right: 0;
        top: 0;
        width: 430px;
        height: 560px;
        background: #eef6ff;
        transform: skewX(-12deg) translateX(118px);
      }

      .copy {
        position: relative;
        z-index: 2;
        width: 520px;
        padding-top: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand img {
        width: 86px;
        height: 86px;
        border-radius: 24px;
        box-shadow: 0 20px 42px rgba(52, 120, 246, 0.24);
      }

      .brand h1 {
        margin: 0;
        font-size: 50px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      h2 {
        margin: 34px 0 0;
        color: #14213d;
        font-size: 58px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .subhead {
        margin: 24px 0 0;
        color: #536072;
        font-size: 24px;
        line-height: 1.52;
      }

      .chips {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border: 1px solid #dbe5f2;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #263044;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 10px 22px rgba(23, 32, 51, 0.07);
      }

      .chip::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3478f6;
        content: "";
      }

      .chip:nth-child(2)::before {
        background: #18a66a;
      }

      .chip:nth-child(3)::before {
        background: #f4b63f;
      }

      .browser {
        position: absolute;
        right: 68px;
        top: 64px;
        z-index: 2;
        width: 754px;
        height: 432px;
        overflow: hidden;
        border: 1px solid #d8e1ed;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 28px 82px rgba(23, 32, 51, 0.18);
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 42px;
        padding: 0 17px;
        border-bottom: 1px solid #e7edf5;
        background: #fbfdff;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #cad4e5;
      }

      .url {
        flex: 1;
        height: 22px;
        margin-left: 12px;
        padding: 0 13px;
        border-radius: 999px;
        color: #748096;
        background: #eef3fa;
        font-size: 12px;
        line-height: 22px;
      }

      .page {
        display: grid;
        grid-template-columns: 236px 1fr;
        height: 390px;
        background: #f8fbff;
      }

      .sidebar {
        padding: 26px 22px;
        border-right: 1px solid #e8eef6;
        background: #ffffff;
      }

      .side-title {
        margin: 0 0 18px;
        font-size: 20px;
        font-weight: 900;
      }

      .side-item {
        height: 38px;
        margin-top: 10px;
        padding: 0 13px;
        border-radius: 12px;
        color: #536072;
        background: #f2f6fc;
        font-size: 14px;
        font-weight: 700;
        line-height: 38px;
      }

      .side-item.active {
        color: #2267dc;
        background: #eaf2ff;
      }

      .content {
        position: relative;
        padding: 28px;
      }

      .post {
        position: relative;
        height: 230px;
        padding: 25px 26px;
        border: 1px solid #e0e7f1;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 16px 38px rgba(23, 32, 51, 0.08);
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(145deg, #3478f6, #6658e8);
      }

      .name {
        position: absolute;
        top: 27px;
        left: 80px;
        font-size: 18px;
        font-weight: 900;
      }

      .meta {
        position: absolute;
        top: 53px;
        left: 80px;
        color: #748096;
        font-size: 13px;
      }

      .export {
        position: absolute;
        top: 24px;
        right: 24px;
        height: 36px;
        padding: 0 18px;
        border-radius: 999px;
        color: #ffffff;
        background: #3478f6;
        font-size: 14px;
        font-weight: 900;
        line-height: 36px;
      }

      .text {
        margin-top: 30px;
        width: 358px;
        color: #263044;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.62;
      }

      .attachments {
        display: flex;
        gap: 10px;
        margin-top: 19px;
      }

      .attachment {
        height: 34px;
        padding: 0 13px;
        border-radius: 10px;
        color: #2267dc;
        background: #eaf2ff;
        font-size: 13px;
        font-weight: 900;
        line-height: 34px;
      }

      .popup {
        position: absolute;
        right: 28px;
        bottom: 28px;
        width: 300px;
        padding: 18px;
        border: 1px solid #e2e8f1;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 24px 58px rgba(23, 32, 51, 0.2);
      }

      .popup-brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .popup-brand img {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .popup h3 {
        margin: 0;
        font-size: 17px;
      }

      .popup p {
        margin: 2px 0 0;
        color: #748096;
        font-size: 12px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        margin-top: 15px;
        padding: 0 12px;
        border-radius: 11px;
        color: #0f7b55;
        background: #eaf8f1;
        font-size: 13px;
        font-weight: 800;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #18a66a;
        content: "";
      }

      .button {
        height: 40px;
        margin-top: 12px;
        border-radius: 11px;
        color: #ffffff;
        background: #3478f6;
        font-size: 14px;
        font-weight: 900;
        line-height: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="stripe" aria-hidden="true"></div>
      <section class="copy">
        <div class="brand">
          <img src="../../static/icons/icon-enabled-128.png" alt="" />
          <h1>小鹅通助手</h1>
        </div>
        <h2>把鹅圈子内容完整打包成 ZIP</h2>
        <p class="subhead">帖子正文、附件、一级评论、回复评论和评论媒体都在浏览器本地归档。</p>
        <div class="chips">
          <span class="chip">一键导出</span>
          <span class="chip">本地处理</span>
          <span class="chip">离线阅读</span>
        </div>
      </section>

      <section class="browser" aria-label="扩展使用场景预览">
        <div class="bar">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <div class="url">quanzi.xiaoe-tech.com / feed_detail</div>
        </div>
        <div class="page">
          <aside class="sidebar">
            <p class="side-title">鹅圈子</p>
            <div class="side-item active">课程讨论</div>
            <div class="side-item">资料沉淀</div>
            <div class="side-item">作业反馈</div>
          </aside>
          <div class="content">
            <article class="post">
              <div class="avatar"></div>
              <div class="name">社群复盘帖</div>
              <div class="meta">正文、附件、评论和媒体</div>
              <div class="export">打包下载</div>
              <p class="text">把帖子和完整评论树导出为离线包，保留附件、图片、音频和视频素材。</p>
              <div class="attachments">
                <span class="attachment">PDF 附件</span>
                <span class="attachment">评论图片</span>
                <span class="attachment">回复评论</span>
              </div>
            </article>
            <section class="popup">
              <div class="popup-brand">
                <img src="../../static/icons/icon-enabled-128.png" alt="" />
                <div>
                  <h3>帖子打包器</h3>
                  <p>正文、附件、完整评论一次下载</p>
                </div>
              </div>
              <div class="status">已识别帖子详情页</div>
              <div class="button">打包当前帖子</div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
